[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-watcher"
version = "0.1.0"
description = "Filesystem-watching, cache-aware context assembly service for LLM coding agents"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=3.0",
    "mcp>=1.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
context-watcher = "context_watcher.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["context_watcher"]
